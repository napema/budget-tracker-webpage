<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Registro</title>
<meta name="theme-color" content="#F1F0F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0A0E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Registro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --blue:#0A84FF; --green:#34C759; --red:#FF3B30; --orange:#FF9500;
  --yellow:#FFCC00; --purple:#AF52DE; --pink:#FF2D55; --teal:#30B0C7;
  --indigo:#5856D6; --cyan:#32ADE6; --gray:#8E8E93;

  --bg:#F1F0F6;
  --txt:#0A0A0C; --txt2:rgba(60,60,67,.62); --txt3:rgba(60,60,67,.32);
  --glass:rgba(255,255,255,.60); --glass-2:rgba(255,255,255,.44);
  --glass-brd:rgba(255,255,255,.85);
  --hair:rgba(60,60,67,.10); --sunk:rgba(120,120,128,.11);
  --shadow:0 1px 2px rgba(0,0,0,.035), 0 10px 30px -10px rgba(30,30,60,.15);
  --blur:blur(30px) saturate(180%);
  --r:24px; --r-s:16px;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --spring:cubic-bezier(.32,.72,0,1);
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Inter,system-ui,sans-serif;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0A0A0E; --txt:#F5F5F7; --txt2:rgba(235,235,245,.60); --txt3:rgba(235,235,245,.28);
    --glass:rgba(38,38,45,.60); --glass-2:rgba(54,54,62,.46); --glass-brd:rgba(255,255,255,.13);
    --hair:rgba(235,235,245,.09); --sunk:rgba(120,120,128,.22);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 32px -8px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--font);font-size:16px;line-height:1.45;
  letter-spacing:-.011em;-webkit-font-smoothing:antialiased;padding-top:var(--sat);
  overscroll-behavior-y:none;min-height:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;letter-spacing:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}

.aurora{position:fixed;inset:-25%;z-index:-1;pointer-events:none;filter:blur(95px);opacity:.8}
.aurora i{position:absolute;display:block;border-radius:50%}
.aurora i:nth-child(1){width:52vmax;height:52vmax;left:-8%;top:-6%;background:#7FD8FF;animation:d1 30s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:46vmax;height:46vmax;right:-10%;top:8%;background:#FFB4D2;animation:d2 35s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:44vmax;height:44vmax;left:16%;bottom:-14%;background:#A8F0C6;animation:d3 27s ease-in-out infinite alternate}
.aurora i:nth-child(4){width:34vmax;height:34vmax;right:6%;bottom:-6%;background:#C7BCFF;animation:d1 38s ease-in-out infinite alternate-reverse}
@media(prefers-color-scheme:dark){.aurora{opacity:.32}
  .aurora i:nth-child(1){background:#0A84FF}.aurora i:nth-child(2){background:#FF2D55}
  .aurora i:nth-child(3){background:#34C759}.aurora i:nth-child(4){background:#5856D6}}
@keyframes d1{to{transform:translate(7%,9%) scale(1.14)}}
@keyframes d2{to{transform:translate(-9%,7%) scale(1.1)}}
@keyframes d3{to{transform:translate(6%,-8%) scale(1.16)}}

.g{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:.5px solid var(--glass-brd);border-radius:var(--r);box-shadow:var(--shadow);position:relative;overflow:hidden}
.g::before{content:'';position:absolute;left:0;right:0;top:0;height:50%;
  background:linear-gradient(to bottom,rgba(255,255,255,.28),rgba(255,255,255,0));pointer-events:none}
@media(prefers-color-scheme:dark){.g::before{background:linear-gradient(to bottom,rgba(255,255,255,.07),rgba(255,255,255,0))}}
.g>*{position:relative}

.wrap{max-width:1120px;margin:0 auto;padding:0 16px calc(150px + var(--sab))}
.hidden{display:none!important}
.eyebrow{font-size:12.5px;font-weight:600;color:var(--txt2)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 2px 14px}
.top h1{font-size:28px;font-weight:700;margin:0;letter-spacing:-.03em}
.mnav{display:flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:var(--glass-2);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:.5px solid var(--glass-brd)}
.mnav button{width:32px;height:32px;border-radius:999px;color:var(--txt2);display:grid;place-items:center;transition:background .2s}
.mnav button:active{background:var(--sunk)}
.mnav .lbl{min-width:74px;text-align:center;font-size:13.5px;font-weight:600;color:var(--txt)}
.chip-sync{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;flex-shrink:0;
  background:var(--glass-2);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:.5px solid var(--glass-brd)}
.chip-sync svg{width:19px;height:19px}
.chip-sync.ok{color:var(--green)} .chip-sync.busy{color:var(--blue);animation:pulse 1.3s ease-in-out infinite}
.chip-sync.err{color:var(--red)} .chip-sync.off{color:var(--txt3)}
@keyframes pulse{50%{opacity:.3}}

.card{padding:20px;margin-bottom:14px}
.card h3{font-size:17px;font-weight:600;margin:0 0 16px;letter-spacing:-.022em}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px}
.card-h h3{margin:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.stat{padding:17px}
.stat .k{font-size:12.5px;font-weight:600;color:var(--txt2)}
.stat .v{font-size:25px;font-weight:700;letter-spacing:-.03em;margin-top:6px}
.stat .d{font-size:12px;color:var(--txt3);margin-top:3px}

/* sforamenti */
.over{padding:20px;margin-bottom:14px;display:flex;align-items:center;gap:16px}
.over .big{font-size:44px;font-weight:700;letter-spacing:-.04em;line-height:1}
.over .tx1{font-size:15px;font-weight:600;letter-spacing:-.017em}
.over .tx2{font-size:13.5px;color:var(--txt2);margin-top:3px;line-height:1.4}

.pace{padding:22px}
.pace-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.pace-amt{font-size:44px;font-weight:700;letter-spacing:-.038em;line-height:1.02;margin-top:6px}
.pace-sub{font-size:13.5px;color:var(--txt2);margin-top:5px}
.pace-r{text-align:right;flex-shrink:0}
.pace-r .v{font-size:19px;font-weight:600;letter-spacing:-.02em;margin-top:5px}
.track{position:relative;height:14px;border-radius:999px;background:var(--sunk);margin:22px 0 0}
.track .fill{position:absolute;inset:0 auto 0 0;border-radius:999px;transition:width .7s var(--spring)}
.track .fill::after{content:'';position:absolute;inset:0;border-radius:999px;
  background:linear-gradient(to bottom,rgba(255,255,255,.32),rgba(255,255,255,0) 60%)}
.track .now{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:999px;background:var(--txt);
  box-shadow:0 0 0 2.5px var(--bg);transition:left .7s var(--spring)}
.tleg{display:flex;justify-content:space-between;margin-top:12px;font-size:12.5px;color:var(--txt2)}
.verdict{margin-top:18px;padding-top:18px;border-top:.5px solid var(--hair);font-size:14.5px;line-height:1.5;color:var(--txt2)}
.verdict b{color:var(--txt);font-weight:600}

.acts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
.act{border-radius:var(--r);padding:30px 14px;display:flex;flex-direction:column;align-items:center;gap:11px;
  font-weight:600;font-size:15.5px;letter-spacing:.01em;color:#fff;position:relative;overflow:hidden;
  transition:transform .34s var(--spring),filter .2s;box-shadow:0 8px 24px -8px var(--sh)}
.act::before{content:'';position:absolute;left:0;right:0;top:0;height:50%;
  background:linear-gradient(to bottom,rgba(255,255,255,.3),rgba(255,255,255,0));pointer-events:none}
.act:active{transform:scale(.955);filter:brightness(.93)}
.act svg{width:27px;height:27px;position:relative} .act span{position:relative}
.act.out{background:var(--red);--sh:rgba(255,59,48,.5)}
.act.in{background:var(--green);--sh:rgba(52,199,89,.45)}

.badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;position:relative;overflow:hidden}
.badge::after{content:'';position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,0))}
.badge svg{width:21px;height:21px;color:#fff;position:relative}

.tx{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:.5px solid var(--hair);cursor:pointer;transition:opacity .18s}
.tx:last-child{border-bottom:0} .tx:active{opacity:.5}
.tx-m{flex:1;min-width:0}
.tx-n{font-size:15.5px;font-weight:500;letter-spacing:-.016em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-s{font-size:13px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tx-a{font-size:16px;font-weight:600;letter-spacing:-.02em;flex-shrink:0;text-align:right}
.tx-k{font-size:11px;color:var(--txt3);margin-top:1px;font-weight:500}
.daygroup{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--txt2);padding:20px 6px 9px}
.empty{text-align:center;padding:38px 18px;color:var(--txt2);font-size:14.5px;line-height:1.6}

.ins{display:flex;gap:13px;align-items:flex-start;padding:14px 0;border-bottom:.5px solid var(--hair);font-size:14.5px;line-height:1.5;color:var(--txt2)}
.ins:last-child{border-bottom:0}
.ins .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:6px}
.ins b{color:var(--txt);font-weight:600}

.crow{margin-bottom:17px} .crow:last-child{margin-bottom:0}
.crow-t{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.crow-t .n{flex:1;font-size:15px;font-weight:500;letter-spacing:-.016em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow-t .a{font-size:15px;font-weight:600;letter-spacing:-.02em}
.cbar{height:9px;border-radius:999px;background:var(--sunk);overflow:hidden}
.cbar i{display:block;height:100%;border-radius:999px;transition:width .7s var(--spring)}
.crow-s{font-size:12.5px;color:var(--txt3);margin-top:6px}

.nav{position:fixed;left:14px;right:14px;bottom:calc(22px + var(--sab));z-index:40;display:flex;padding:7px;
  border-radius:999px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:.5px solid var(--glass-brd);box-shadow:0 8px 30px -8px rgba(20,20,50,.25);max-width:430px;margin:0 auto}
.nav button{flex:1;padding:9px 0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--txt2);
  font-size:10.5px;font-weight:600;border-radius:999px;transition:color .25s var(--spring),background .25s var(--spring)}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--txt);background:var(--glass-2)}
.nav button:active{transform:scale(.94)}

body.locked{position:fixed;left:0;right:0;width:100%;overflow:hidden}
.sheet{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;touch-action:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.3);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fd .28s}
.panel{position:relative;width:100%;max-width:490px;max-height:92vh;overflow-y:auto;border-radius:30px 30px 0 0;
  padding:10px 18px 0;background:var(--glass);
  -webkit-backdrop-filter:blur(36px) saturate(180%);backdrop-filter:blur(36px) saturate(180%);
  border:.5px solid var(--glass-brd);animation:up .42s var(--spring);
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
@keyframes fd{from{opacity:0}}
@keyframes up{from{transform:translateY(101%)}}
.grab{width:40px;height:5px;border-radius:999px;background:var(--txt3);margin:0 auto}
.sheet-h{position:sticky;top:0;z-index:6;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:8px;padding:12px 0 14px;margin:0 -18px;padding-left:18px;padding-right:18px;
  background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border-bottom:.5px solid var(--hair)}
.sheet-h .t{font-size:17px;font-weight:600;letter-spacing:-.02em;text-align:center;white-space:nowrap}
.hbtn{font-size:16px;font-weight:500;color:var(--blue);padding:8px 2px;transition:opacity .2s;white-space:nowrap}
.hbtn:active{opacity:.45}
.hbtn.rt{text-align:right} .hbtn.dg{color:var(--red)}
.foot{position:sticky;bottom:0;z-index:6;margin:0 -18px;padding:14px 18px calc(16px + var(--sab));
  background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border-top:.5px solid var(--hair)}
.amt{text-align:center;padding:16px 0 14px;font-size:52px;font-weight:700;letter-spacing:-.042em;line-height:1;transition:color .3s}
.amt .c{font-size:26px;font-weight:600;color:var(--txt3);margin-right:5px;vertical-align:6px}

.seg{display:flex;gap:3px;padding:3px;background:var(--sunk);border-radius:12px;margin-bottom:16px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--txt2);
  transition:all .3s var(--spring);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--glass);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.1)}

.fld{margin-bottom:16px}
.fld label{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:600;color:var(--txt2);margin:0 0 8px 3px}
input,select{font:inherit;font-size:16.5px;color:var(--txt);width:100%;padding:14px 15px;background:var(--glass-2);
  border:.5px solid var(--hair);border-radius:var(--r-s);-webkit-appearance:none;appearance:none;transition:border-color .2s,box-shadow .2s}
input::placeholder{color:var(--txt3)}
input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3.5px rgba(10,132,255,.16)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;padding:9px 14px 9px 10px;border-radius:999px;background:var(--glass-2);
  border:.5px solid var(--hair);font-size:14px;font-weight:500;letter-spacing:-.01em;transition:transform .3s var(--spring),background .2s,color .2s}
.chip i{width:9px;height:9px;border-radius:50%;display:block;flex-shrink:0}
.chip:active{transform:scale(.93)}
.chip.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.chip.sub{padding:8px 13px}
.auto-hint{font-size:12.5px;color:var(--blue);font-weight:600;display:flex;align-items:center;gap:5px}
.auto-hint svg{width:13px;height:13px}

.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.keys button{background:var(--glass-2);border:.5px solid var(--hair);border-radius:13px;padding:13px 0;
  font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;transition:transform .28s var(--spring),background .15s}
.keys button:active{transform:scale(.92);background:var(--sunk)}
.save{width:100%;padding:17px;border-radius:var(--r-s);font-size:17px;font-weight:600;letter-spacing:-.015em;color:#fff;
  position:relative;overflow:hidden;transition:transform .3s var(--spring),opacity .25s}
.save::before{content:'';position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0))}
.save span{position:relative} .save:active{transform:scale(.975)} .save:disabled{opacity:.32}

.ghost{padding:13px 17px;border-radius:var(--r-s);font-size:15px;font-weight:500;background:var(--glass-2);
  border:.5px solid var(--hair);letter-spacing:-.015em;transition:transform .3s var(--spring),background .15s}
.ghost:active{transform:scale(.96);background:var(--sunk)}
.ghost.dg{color:var(--red)}
.link{font-size:14.5px;color:var(--blue);font-weight:500}
.row{display:flex;gap:11px;align-items:center}
.sync-line{display:flex;align-items:center;gap:10px;font-size:14px;padding:12px 14px;border-radius:var(--r-s);
  background:var(--glass-2);border:.5px solid var(--hair);margin-bottom:16px}
.sync-line .dt{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(112px + var(--sab));background:var(--glass);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:.5px solid var(--glass-brd);color:var(--txt);
  padding:13px 22px;border-radius:999px;font-size:14.5px;font-weight:500;z-index:200;
  animation:up .35s var(--spring);box-shadow:0 10px 32px -8px rgba(0,0,0,.26)}
svg.ch{width:100%;display:block;overflow:visible}

#view>*{animation:enter .5s var(--spring) both}
#view>*:nth-child(1){animation-delay:.02s} #view>*:nth-child(2){animation-delay:.06s}
#view>*:nth-child(3){animation-delay:.1s}  #view>*:nth-child(4){animation-delay:.14s}
#view>*:nth-child(5){animation-delay:.18s} #view>*:nth-child(n+6){animation-delay:.22s}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.985)}}

#view.noanim>*{animation:none!important}
.mrow{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:.5px solid var(--hair);cursor:pointer;transition:opacity .18s}
.mrow:last-child{border-bottom:0} .mrow:active{opacity:.5}
.mrow .nm{flex:1;font-size:15.5px;font-weight:500;letter-spacing:-.016em}
.mrow .ct{font-size:13px;color:var(--txt3)}
.mrow .ar{color:var(--txt3);font-size:19px}
.addrow{display:flex;align-items:center;gap:11px;padding:14px 0;color:var(--blue);font-size:15px;font-weight:500;cursor:pointer;width:100%}
.addrow svg{width:19px;height:19px}
.swatch{display:flex;flex-wrap:wrap;gap:10px}
.swatch button{width:36px;height:36px;border-radius:999px;position:relative;transition:transform .3s var(--spring)}
.swatch button:active{transform:scale(.88)}
.swatch button.on::after{content:'';position:absolute;inset:-4px;border-radius:999px;border:2.5px solid var(--txt)}
.icgrid{display:flex;flex-wrap:wrap;gap:9px}
.icgrid button{width:44px;height:44px;border-radius:13px;background:var(--glass-2);border:.5px solid var(--hair);
  display:grid;place-items:center;color:var(--txt2);transition:transform .3s var(--spring),background .2s}
.icgrid button svg{width:21px;height:21px}
.icgrid button:active{transform:scale(.9)}
.icgrid button.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
@media(min-width:860px){
  .wrap{padding-bottom:36px;padding-top:8px}
  .nav{position:sticky;top:12px;bottom:auto;left:auto;right:auto;margin:0 auto 18px}
  .cols{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;align-items:start}
  .acts{max-width:440px}
  .sheet{align-items:center}
  .panel{border-radius:30px;max-height:90vh}
  @keyframes up{from{transform:translateY(20px);opacity:0}}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="wrap">
  <div class="top">
    <h1 id="vTitle">Registro</h1>
    <div class="row" style="gap:9px">
      <span id="syncSlot"></span>
      <div class="mnav">
        <button id="pM" aria-label="Mese precedente">‹</button>
        <span class="lbl num" id="mLbl"></span>
        <button id="nM" aria-label="Mese successivo">›</button>
      </div>
    </div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div id="view"></div>
</div>
<div id="sheetHost"></div>
<div id="toastHost"></div>

<script src="config.js" onerror="window.RCFG=null"></script>
<script>
'use strict';

/* ═══════════ ICONE ═══════════ */

  o.cats.forEach(c=>Object.values(o.profili).forEach(P=>{ if(P.b[c.id]===undefined) P.b[c.id]=0; }));

function merge(a,b){
  const A=normalize(a),B=normalize(b),o=blank();
  const gr={}; [...A.tomb,...B.tomb].forEach(t=>{ if(!gr[t.id]||t.up>gr[t.id]) gr[t.id]=t.up; });
  const map={}; [...A.tx,...B.tx].forEach(t=>{ const c=map[t.id]; if(!c||(t.up||0)>(c.up||0)) map[t.id]=t; });
  o.tx=Object.values(map).filter(t=>!(gr[t.id]>=(t.up||0)));
  o.tomb=Object.entries(gr).map(([id,up])=>({id,up})).filter(g=>Date.now()-g.up<1000*60*60*24*120);
  const S=(A.meta.up>=B.meta.up)?A:B;
  o.profili=S.profili; o.cats=S.cats; o.catsIn=S.catsIn; o.meta={up:Math.max(A.meta.up,B.meta.up)};
  o.rules={}; [A.rules,B.rules].forEach(src=>Object.entries(src||{}).forEach(([tk,cs])=>{
    o.rules[tk]=o.rules[tk]||{}; Object.entries(cs).forEach(([c,n])=>{ o.rules[tk][c]=Math.max(o.rules[tk][c]||0,n); });
  }));
  return o;
}

async function gh(method,extra){
  const url=`https://api.github.com/repos/${SY.repo}/contents/${SY.path}`+(method==='GET'?`?ref=${SY.branch}&t=${Date.now()}`:'');
  const o={method,cache:'no-store',headers:{'Authorization':'Bearer '+SY.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}};
  if(extra){ o.headers['Content-Type']='application/json'; o.body=JSON.stringify(extra); }
  const r=await fetch(url,o);
  return {ok:r.ok,status:r.status,body:r.status===204?null:await r.json().catch(()=>null)};
}
function setState(s,m){
  SY.state=s; SY.msg=m||''; saveSync();
  const el=document.getElementById('syncSlot'); if(el) el.innerHTML=chipHTML();
  const st=document.getElementById('syncStatus'); if(st) st.innerHTML=statusHTML();
}
const sig=()=>JSON.stringify({t:DB.tx,d:DB.tomb,p:DB.profili,c:DB.cats,ci:DB.catsIn,m:DB.meta});

async function syncNow(silent){
  if(!syncOn()||syncing) return;
  syncing=true; if(!silent) setState('busy');
  try{
    let remote=null,sha=null;
    const g=await gh('GET');
    if(g.ok&&g.body&&g.body.content){ sha=g.body.sha; try{ remote=JSON.parse(b64dec(g.body.content)); }catch(e){} }
    else if(g.status===404){ sha=null; }
    else if(g.status===401||g.status===403) throw new Error('Token rifiutato — controlla permessi e scadenza');
    else throw new Error('GitHub ha risposto '+g.status);

    const before=sig();
    if(remote) DB=merge(DB,remote);
    save();
    const payload=JSON.stringify({v:4,tx:DB.tx,tomb:DB.tomb,profili:DB.profili,cats:DB.cats,catsIn:DB.catsIn,rules:DB.rules,meta:DB.meta},null,1);
    const remotePayload=remote?JSON.stringify({v:4,tx:remote.tx||[],tomb:remote.tomb||[],profili:remote.profili,cats:remote.cats,catsIn:remote.catsIn,rules:remote.rules,meta:remote.meta},null,1):null;

    if(payload!==remotePayload){
      const p=await gh('PUT',{message:'registro '+new Date().toISOString().slice(0,16).replace('T',' '),
        content:b64enc(payload),branch:SY.branch,...(sha?{sha}:{})});
      if(p.status===409){ syncing=false; return syncNow(silent); }
      if(!p.ok) throw new Error(p.body&&p.body.message?p.body.message:'Scrittura rifiutata ('+p.status+')');
      SY.sha=p.body&&p.body.content?p.body.content.sha:sha;
    } else SY.sha=sha;

    SY.at=Date.now(); lastPull=Date.now(); retryN=0; clearTimeout(retryTimer);
    setState('ok');
    if(before!==sig()) render(!!silent);
    if(!silent) toast('Sincronizzato');
  }catch(e){
    setState('err',e.message||'Errore di rete');
    if(!silent) toast(SY.msg);
    clearTimeout(retryTimer);
    const w=[4000,12000,30000,90000][Math.min(retryN++,3)];
    retryTimer=setTimeout(()=>{ syncing=false; syncNow(true); },w);
  } finally { syncing=false; }
}
function queueSync(){ if(!syncOn()) return; clearTimeout(syncTimer); syncTimer=setTimeout(()=>syncNow(true),1200); }

function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s&.]/g,' ').replace(/\s+/g,' ').trim(); }
function toks(s){ return norm(s).split(' ').filter(t=>t.length>=3); }
function catList(side){ return side==='in'?DB.catsIn:DB.cats; }

function guess(note,side){
  const n=norm(note); if(n.length<2) return null;
  let best=null,bs=0;
  toks(note).forEach(t=>{ const r=DB.rules[t]; if(!r) return;
    Object.entries(r).forEach(([k,c])=>{ if(c>bs){ bs=c; best=k; } }); });
  if(best){ const [c,s]=best.split('/'); if(catList(side).find(x=>x.id===c)) return {cat:c,sub:s,why:'imparato'}; }
  let m=null,len=0;
  catList(side).forEach(c=>(c.subs||[]).forEach(s=>(s.kw||[]).forEach(w=>{
    const nw=norm(w);
    if(nw&&nw.length>len&&n.includes(nw)){ m={cat:c.id,sub:s.id}; len=nw.length; }
  })));
  return m?{...m,why:'suggerito'}:null;
}
function learn(note,cat,sub){
  const k=cat+'/'+sub;
  toks(note).forEach(t=>{ DB.rules[t]=DB.rules[t]||{}; DB.rules[t][k]=(DB.rules[t][k]||0)+1; });
  const ks=Object.keys(DB.rules); if(ks.length>800) ks.slice(0,ks.length-800).forEach(x=>delete DB.rules[x]);
}

/* ═══════════ INSIGHT ═══════════ */
function insights(y,m){
  const R='var(--red)',G='var(--green)',O='var(--orange)',N='var(--gray)';
  const out=[], all=monthTx(y,m), tx=all.filter(t=>t.kind==='out');
  if(!tx.length) return [{c:N,t:'Nessuna uscita in questo mese.'}];
  const total=tx.reduce((a,t)=>a+t.amount,0), dim=daysIn(y,m);
  const today=(y===now.getFullYear()&&m===now.getMonth())?now.getDate():dim;
  const P=DB.profili[profileKey(y,m)], budget=Object.values(P.b).reduce((a,b)=>a+b,0);

  const ex=extras(all);
  if(ex.length) out.push({c:R,t:`<b>${ex.length} ricariche extra</b> per ${eur(ex.reduce((a,t)=>a+t.amount,0))}. Ogni ricarica è uno sforamento del sistema, non un movimento neutro.`});
  else out.push({c:G,t:`<b>Zero ricariche extra.</b> Il sistema a pocket ha retto tutto il mese.`});

  if(today<dim&&today>2) out.push({c:N,t:`Al ritmo attuale chiudi a <b>${eur(Math.round(total/today*dim))}</b> su ${eur(budget,0)} di budget.`});

  const byCat={}; tx.forEach(t=>byCat[t.cat]=(byCat[t.cat]||0)+t.amount);
  DB.cats.forEach(c=>{ const b=P.b[c.id]||0, v=byCat[c.id]||0;
    if(b>0&&v>b) out.push({c:R,t:`<b>${esc(c.n)}</b> ha sforato: ${eur(v)} su ${eur(b,0)}.`});
    else if(b>0&&today<dim&&v>b*(today/dim)*1.25) out.push({c:O,t:`<b>${esc(c.n)}</b> corre più veloce del mese: ${eur(v)} su ${eur(b,0)} al giorno ${today}.`});
  });

  const bySub={}; tx.forEach(t=>{const k=t.cat+'/'+t.sub;bySub[k]=(bySub[k]||0)+t.amount;});
  const top=Object.entries(bySub).sort((a,b)=>b[1]-a[1])[0];
  if(top&&top[1]/total>=.2){
    const [ci,si]=top[0].split('/'); const c=DB.cats.find(x=>x.id===ci)||{n:ci,subs:[]};
    const s=(c.subs||[]).find(x=>x.id===si);
    out.push({c:O,t:`<b>${esc(s?s.n:si)}</b> da sola vale il ${Math.round(top[1]/total*100)}% del mese (${eur(top[1])}).`});
  }

  const mic=tx.filter(t=>t.amount<=1000);
  if(mic.length>=5){ const mt=mic.reduce((a,t)=>a+t.amount,0);
    out.push({c:O,t:`<b>${mic.length} spese sotto i 10 €</b> per ${eur(mt)}, il ${Math.round(mt/total*100)}% del mese.`}); }

  const rimb=all.filter(t=>t.kind==='rimb'||t.kind==='reso');
  if(rimb.length) out.push({c:N,t:`${rimb.length} tra rimborsi e resi per ${eur(rimb.reduce((a,t)=>a+t.amount,0))}, tenuti fuori dal conteggio delle spese.`});

  const z=today-new Set(tx.map(t=>t.date)).size;
  if(z>=5) out.push({c:G,t:`<b>${z} giorni a spesa zero</b> su ${today}.`});

  return out.slice(0,7);
}

function mgrDelete(what){

    Object.values(DB.profili).forEach(P=>delete P.b[MG.cat]);

let E=null, lockY=0, locked=false;
function lockScroll(){
  if(locked||!document.body) return; locked=true;
  lockY=window.scrollY||0;
  document.body.style.top=(-lockY)+'px';
  document.body.classList.add('locked');
}
function unlockScroll(){
  if(!locked||!document.body) return; locked=false;
  document.body.classList.remove('locked');
  document.body.style.top='';
  window.scrollTo(0,lockY);
}

/* trascina verso il basso l'intestazione per chiudere, come su iOS */
function bindDrag(onClose){
  const panel=document.querySelector('.panel');
  const handle=document.querySelector('.grab');
  const head=document.querySelector('.sheet-h');
  if(!panel||!handle) return;
  let y0=null,dy=0;
  const start=e=>{ if(panel.scrollTop>2) return; y0=e.touches[0].clientY; dy=0; panel.style.transition='none'; };
  const move=e=>{ if(y0===null) return;
    dy=e.touches[0].clientY-y0;
    if(dy<0){ dy=0; return; }
    e.preventDefault();
    panel.style.transform='translateY('+dy+'px)'; };
  const end=()=>{ if(y0===null) return;
    panel.style.transition='transform .38s cubic-bezier(.32,.72,0,1)';
    if(dy>110){ panel.style.transform='translateY(100%)'; setTimeout(onClose,220); }
    else panel.style.transform='';
    y0=null; };
  [handle,head].forEach(el=>{ if(!el) return;
    el.addEventListener('touchstart',start,{passive:true});
    el.addEventListener('touchmove',move,{passive:false});
    el.addEventListener('touchend',end);
    el.addEventListener('touchcancel',end); });
}

  const w=document.getElementById('chipWrap'); if(w) w.innerHTML=chipsHTML();
  const h=document.getElementById('autoHint'); if(h) h.innerHTML=E.auto?`${ic('wand',2)}${E.auto==='imparato'?'assegnata da sola':'suggerita'}`:'';
  const kw=document.getElementById('kindWrap'); if(kw) kw.innerHTML=kindList().map(k=>`<button class="${E.kind===k?'on':''}" data-kind="${k}">${esc(KINDS[k].n)}</button>`).join('');
  const cl=document.getElementById('catLabel'); if(cl) cl.style.display=neutralKind()?'none':'';
  refreshSave();
}
function refreshSave(){
  const b=document.getElementById('saveTx'); if(!b) return;
  const need=neutralKind()?(cents(E.raw)>0&&E.note.trim()):(cents(E.raw)>0&&E.note.trim()&&E.cat&&E.sub);
  b.disabled=!need;
  b.style.background=KINDS[E.kind].col;
  b.innerHTML=`<span>${!cents(E.raw)?'Inserisci un importo':!E.note.trim()?'Scrivi su cosa':!E.cat&&!neutralKind()?'Scegli una categoria':!E.sub&&!neutralKind()?'Scegli una sottocategoria':(E.id?'Salva modifiche':'Registra')}</span>`;
}
function bindNote(){
  const n=document.getElementById('noteIn'); if(!n) return;
  n.addEventListener('input',()=>{
    E.note=n.value;
    if(!E.touched&&!neutralKind()){
      const g=guess(E.note,E.side);
      if(g){ E.cat=g.cat; E.sub=g.sub; E.auto=g.why; } else { E.cat=null; E.sub=null; E.auto=null; }
      redraw();
    } else refreshSave();
  });
}
function drawSheet(){
  const K=KINDS[E.kind], keys=['1','2','3','4','5','6','7','8','9','C','0','⌫'];
  document.getElementById('sheetHost').innerHTML=`
  <div class="sheet"><div class="scrim" data-close="1"></div>
   <div class="panel">
    <div class="grab"></div>
    <div class="sheet-h">
      <button class="hbtn" data-close="1">Annulla</button>
      <span class="t" style="color:${K.col}">${E.id?'Modifica':E.side==='out'?'Uscita':'Entrata'}</span>
      ${E.id?`<button class="hbtn rt dg" id="delTx">Elimina</button>`:`<span></span>`}
    </div>
    <div class="amt num" style="color:${cents(E.raw)?K.col:'var(--txt3)'}"><span class="c">${CUR}</span>${fmtR(E.raw)}</div>
    <div class="keys">${keys.map(k=>`<button data-key="${k}">${k}</button>`).join('')}</div>
    <div class="fld"><label>Su cosa</label>
      <input id="noteIn" placeholder="${E.side==='out'?'Barbiere, Conad, IP, Glovo…':'Stipendio, rimborso Luca…'}" value="${esc(E.note)}" maxlength="60" autocomplete="off" enterkeyhint="done"></div>
    <div class="fld"><label id="catLabel">Categoria <span class="auto-hint" id="autoHint"></span></label><div id="chipWrap"></div></div>
    <div class="fld"><label>Tipo di movimento</label><div class="seg" id="kindWrap"></div></div>
    <div class="fld"><label>Data</label><input type="date" id="dateIn" value="${E.date}"></div>
    <div class="foot"><button class="save" id="saveTx"></button></div>
   </div></div>`;
  redraw(); bindNote(); bindDrag(closeEntry);
}
function commit(){
  pull();
  const c=cents(E.raw), note=E.note.trim();
  if(!c||!note) return;
  if(!neutralKind()&&(!E.cat||!E.sub)) return;
  const cat=neutralKind()?'_neutro':E.cat, sub=neutralKind()?E.kind:E.sub;
  const T=Date.now();
  if(E.id){ const i=DB.tx.findIndex(t=>t.id===E.id);
    if(i>=0) DB.tx[i]={...DB.tx[i],kind:E.kind,amount:c,cat,sub,note,date:E.date,up:T}; }
  else DB.tx.push({id:uid(),kind:E.kind,amount:c,cat,sub,note,date:E.date,ts:T,up:T});
  if(!neutralKind()) learn(note,cat,sub);
  save(); queueSync();
  const [a,b]=E.date.split('-').map(Number); Y=a; M=b-1;
  closeEntry(); render(); toast('Registrato · '+eur(c));
}

/* ═══════════ TOAST ═══════════ */
let tT;
function toast(m){ const h=document.getElementById('toastHost'); if(!h) return;
  h.innerHTML=`<div class="toast">${esc(m)}</div>`; clearTimeout(tT); tT=setTimeout(()=>h.innerHTML='',2300); }

/* ═══════════ IMPORT / EXPORT ═══════════ */
function dl(n,t,m){ const u=URL.createObjectURL(new Blob([t],{type:m})); const a=document.createElement('a'); a.href=u;a.download=n;a.click(); setTimeout(()=>URL.revokeObjectURL(u),1500); }
function expJ(){ dl(`registro-${iso(new Date())}.json`,JSON.stringify({v:4,tx:DB.tx,tomb:DB.tomb,profili:DB.profili,cats:DB.cats,catsIn:DB.catsIn,rules:DB.rules,meta:DB.meta},null,2),'application/json'); toast('Backup esportato'); }
function expC(){
  const r=[['data','tipo','nota','categoria','sottocategoria','importo']];
  [...DB.tx].sort((a,b)=>a.date<b.date?-1:1).forEach(t=>r.push([t.date,(KINDS[t.kind]||{}).n||t.kind,(t.note||'').replace(/;/g,','),catObj(t).n,subName(t),(t.amount/100).toFixed(2).replace('.',',')]));
  dl(`registro-${iso(new Date())}.csv`,r.map(x=>x.join(';')).join('\n'),'text/csv'); toast('CSV esportato');
}
function impJ(f){ const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!Array.isArray(d.tx)) throw 0;
    DB=merge(DB,d); DB.meta.up=Date.now(); save(); queueSync(); render(); toast(`Uniti ${d.tx.length} movimenti`);
  }catch(e){ toast('File non leggibile'); } }; rd.readAsText(f); }

/* ═══════════ RENDER ═══════════ */
function render(soft){
  if(E||MG) return;
  if(soft&&document.activeElement&&document.activeElement.tagName==='INPUT') return;
  const v0=document.getElementById('view');
  if(soft) v0.classList.add('noanim'); else v0.classList.remove('noanim');
  renderNav();
  document.getElementById('syncSlot').innerHTML=chipHTML();
  document.getElementById('mLbl').textContent=MESI[M].slice(0,3)+' '+String(Y).slice(2);
  document.getElementById('vTitle').textContent=TAB==='home'?(curMonth()?'Questo mese':MESI[M][0].toUpperCase()+MESI[M].slice(1)):TAB==='anal'?'Analisi':TAB==='mov'?'Movimenti':'Setup';
  document.getElementById('view').innerHTML=TAB==='home'?viewHome():TAB==='anal'?viewAnalisi():TAB==='mov'?viewMovimenti():viewSetup();
  if(TAB==='set') bindSetup();
}
function bindSetup(){
  const pk=profileKey(Y,M);
  document.querySelectorAll('[data-b]').forEach(el=>el.onchange=()=>{
    DB.profili[pk].b[el.dataset.b]=Math.round((parseFloat(el.value.replace(',','.'))||0)*100);
    DB.meta.up=Date.now(); save(); queueSync(); render(); });
  const pe=document.getElementById('pEntrata'), pc=document.getElementById('pCasa');
  pe.onchange=()=>{ DB.profili[pk].entrata=Math.round((parseFloat(pe.value.replace(',','.'))||0)*100); DB.meta.up=Date.now(); save(); queueSync(); };
  pc.onchange=()=>{ DB.profili[pk].casaAllIn=Math.round((parseFloat(pc.value.replace(',','.'))||0)*100); DB.meta.up=Date.now(); save(); queueSync(); toast('Costo casa aggiornato'); };

  const rp=document.getElementById('syRepo'), tk=document.getElementById('syTok');
  const cs=()=>{ SY.repo=rp.value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/$/,'');
    SY.token=tk.value.trim(); SY.sha=null; SY.optout=false; saveSync(); if(syncOn()) syncNow(); else setState('off'); };
  rp.onchange=cs; tk.onchange=cs;
  document.getElementById('syGo').onclick=()=>{ cs(); if(!syncOn()) toast('Compila repository e token'); };
  const sc=document.getElementById('syCfg');
  if(sc) sc.onclick=async()=>{
    const e=b64enc(SY.token), m=Math.ceil(e.length/3), p=[e.slice(0,m),e.slice(m,m*2),e.slice(m*2)];
    const t='window.RCFG = {\n  r: '+JSON.stringify(SY.repo)+',\n  p: '+JSON.stringify(SY.path)+',\n  b: '+JSON.stringify(SY.branch)+',\n  k: ['+p.map(x=>JSON.stringify(x)).join(', ')+']\n};\n';
    try{ await navigator.clipboard.writeText(t); toast('config.js copiato'); }catch(err){ prompt('Crea config.js nel repo del sito con dentro:',t); } };
  const sl=document.getElementById('syLink');
  if(sl) sl.onclick=async()=>{ const u=cfgLink();
    try{ await navigator.clipboard.writeText(u); toast('Link copiato'); }catch(e){ prompt('Apri questo link sull\'altro dispositivo:',u); } };
  const so=document.getElementById('syOff');
  if(so) so.onclick=()=>{ if(confirm('Disattivare la sincronizzazione su questo dispositivo?')){
    SY={repo:'',path:'registro.json',branch:'main',token:'',sha:null,at:0,state:'off',msg:'',optout:true}; saveSync(); render(); } };
  document.getElementById('mgr').onclick=()=>openMgr('out');
  const f=document.getElementById('fgt');
  if(f) f.onclick=()=>{ if(confirm('Azzerare le associazioni imparate?')){ DB.rules={}; DB.meta.up=Date.now(); save(); queueSync(); render(); } };
  document.getElementById('eJ').onclick=expJ;
  document.getElementById('eC').onclick=expC;
  document.getElementById('iB').onclick=()=>document.getElementById('iF').click();
  document.getElementById('iF').onchange=e=>{ if(e.target.files[0]) impJ(e.target.files[0]); };
  document.getElementById('wp').onclick=()=>{ if(confirm('Cancellare movimenti e budget?')){
    const T=Date.now(); DB.tomb=[...DB.tomb,...DB.tx.map(t=>({id:t.id,up:T}))];
    DB.tx=[]; DB.profili=clone(PROFILI); DB.cats=clone(DEF_CATS); DB.catsIn=clone(DEF_CATS_IN); DB.rules={}; DB.meta.up=T;
    save(); queueSync(); render(); toast('Dati cancellati'); } };
}

/* ═══════════ EVENTI ═══════════ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-sync],[data-open],[data-close],[data-key],[data-kind],[data-cat],[data-sub],[data-tx],#saveTx,#delTx,[data-mside],[data-mcat],[data-msub],[data-mnew],[data-mback],[data-mclose],[data-mcol],[data-mic],[data-mdel],#mSave');
  if(!t) return;
  if(MG){
    if(t.dataset.mclose!==undefined&&t.dataset.mclose){ closeMgr(); return; }
    if(t.dataset.mback){ MG.view=MG.view==='sub'?'cat':'list'; MG.tmpIc=null; MG.tmpCol=null; drawMgr(); return; }
    if(t.dataset.mside){ MG.side=t.dataset.mside; MG.view='list'; drawMgr(); return; }
    if(t.dataset.mcat){ MG.cat=t.dataset.mcat; MG.view='cat'; drawMgr(); return; }
    if(t.dataset.msub){ MG.sub=t.dataset.msub; MG.view='sub'; drawMgr(); return; }
    if(t.dataset.mnew==='cat'){ MG.cat=null; MG.view='cat'; MG.tmpIc='dots'; MG.tmpCol=PALETTE[0]; drawMgr(); return; }
    if(t.dataset.mnew==='sub'){ MG.sub=null; MG.view='sub'; drawMgr(); return; }
    if(t.dataset.mcol){ MG.tmpCol=t.dataset.mcol;
      document.querySelectorAll('[data-mcol]').forEach(b=>b.classList.toggle('on',b.dataset.mcol===MG.tmpCol)); return; }
    if(t.dataset.mic){ MG.tmpIc=t.dataset.mic;
      document.querySelectorAll('[data-mic]').forEach(b=>b.classList.toggle('on',b.dataset.mic===MG.tmpIc)); return; }
    if(t.dataset.mdel){ mgrDelete(t.dataset.mdel); return; }
    if(t.id==='mSave'){ mgrSave(); return; }
    return;
  }
  if(t.dataset.sync){ syncNow(); return; }
  if(t.dataset.tab){ TAB=t.dataset.tab; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(t.dataset.open){ openEntry(t.dataset.open); return; }
  if(t.dataset.close){ closeEntry(); return; }
  if(t.dataset.key){ pull(); const k=t.dataset.key;
    if(k==='C') E.raw=''; else if(k==='⌫') E.raw=E.raw.slice(0,-1);
    else if(E.raw.length<9) E.raw=(E.raw+k).replace(/^0+/,'');
    const d=document.querySelector('.amt');
    if(d){ d.innerHTML=`<span class="c">${CUR}</span>${fmtR(E.raw)}`; d.style.color=cents(E.raw)?KINDS[E.kind].col:'var(--txt3)'; }
    refreshSave(); return; }
  if(t.dataset.kind){ pull(); E.kind=t.dataset.kind;
    const d=document.querySelector('.amt'); if(d) d.style.color=cents(E.raw)?KINDS[E.kind].col:'var(--txt3)';
    const h=document.querySelector('.sheet-h .t'); if(h) h.style.color=KINDS[E.kind].col;
    redraw(); return; }
  if(t.dataset.cat){ pull(); E.cat=E.cat===t.dataset.cat?null:t.dataset.cat; E.sub=null; E.touched=true; E.auto=null; redraw(); return; }
  if(t.dataset.sub){ pull(); E.sub=E.sub===t.dataset.sub?null:t.dataset.sub; E.touched=true; redraw(); return; }
  if(t.id==='saveTx'){ commit(); return; }
  if(t.id==='delTx'){ if(confirm('Eliminare questo movimento?')){
    DB.tx=DB.tx.filter(x=>x.id!==E.id); DB.tomb.push({id:E.id,up:Date.now()});
    save(); queueSync(); closeEntry(); render(); toast('Movimento eliminato'); } return; }
  if(t.dataset.tx){ const x=DB.tx.find(z=>z.id===t.dataset.tx); if(x) openEntry(side(x),x); return; }
});
document.addEventListener('touchmove',e=>{
  if(!(E||MG)) return;
  const p=e.target.closest&&e.target.closest('.panel');
  if(!p) e.preventDefault();
},{passive:false});

document.getElementById('pM').onclick=()=>{ M--; if(M<0){M=11;Y--;} render(); };
document.getElementById('nM').onclick=()=>{ M++; if(M>11){M=0;Y++;} render(); };
document.addEventListener('keydown',e=>{
  if(!E) return;
  const f=document.activeElement&&document.activeElement.tagName==='INPUT';
  if(e.key==='Escape'){ closeEntry(); return; }
  if(e.key==='Enter'){ commit(); return; }
  if(f) return;
  if(/^[0-9]$/.test(e.key)&&E.raw.length<9){ E.raw=(E.raw+e.key).replace(/^0+/,''); drawSheet(); }
  else if(e.key==='Backspace'){ E.raw=E.raw.slice(0,-1); drawSheet(); }
});

/* ═══════════ AVVIO ═══════════ */
const fromLink=readCfgLink();
render();
if(fromLink){ toast('Dispositivo configurato'); }

if(syncOn()){
  syncNow(true);
  pullTimer=setInterval(()=>{ if(document.visibilityState==='visible'&&!E&&!MG) syncNow(true); },20000);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') syncNow(true); });
  window.addEventListener('focus',()=>{ if(Date.now()-lastPull>4000) syncNow(true); });
  window.addEventListener('pageshow',()=>syncNow(true));
  window.addEventListener('online',()=>syncNow(true));
}
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
